# Task execution rules
execution_rules:
  max_concurrent_tasks: 1
  delay_between_tasks: 180  # 3 minutes (reduced for VVS priority)
  max_retries: 2
  timeout_minutes: 45
  priority_order: ["high", "medium", "low"]
  vvs_priority: true  # VVS tasks get priority scheduling
  
# Safety configuration
safety_config:
  require_git_branch: true
  require_backup: true
  require_validation: true
  require_semantic_check: true
  forbidden_patterns:
    - "server/src/services/"
    - "server/src/utils/database.ts"
    - "package.json"
    - "package-lock.json"
    - ".env"
  
# Validation configuration  
validation_config:
  typescript_check: true
  build_check: true
  test_check: true
  lint_check: true
  semantic_check: true
  semantic_model: "gemini-1.5-pro"
