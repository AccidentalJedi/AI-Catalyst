name: Safe MCP Manual Task Dispatch

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: 'The detailed task for the AI agent'
        required: true
        type: string

jobs:
  run-safe-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all history for git commands to work correctly
          fetch-depth: 0
          # Use GitHub token for basic operations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          npm install
          cd server && npm install
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config --global user.name "AI Catalyst MCP"
          git config --global user.email "mcp-bot@users.noreply.github.com"

      - name: Check if Safe MCP script exists
        run: |
          if [ ! -f "scripts/safe_mcp.py" ]; then
            echo "Safe MCP script not found. Creating placeholder..."
            mkdir -p scripts
            echo "print('Safe MCP placeholder - script not implemented yet')" > scripts/safe_mcp.py
          fi

      - name: Run Safe MCP Script
        run: |
          python "scripts/safe_mcp.py" --task "${{ inputs.task_description }}" || echo "Safe MCP script failed, continuing..."
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Check for changes and push
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git add .
            git commit -m "Safe MCP: ${{ inputs.task_description }}" || echo "Nothing to commit"
            git push origin main || echo "Push failed, continuing..."
          fi