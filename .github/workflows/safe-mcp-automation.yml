name: Safe MCP Manual Task Dispatch

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: 'The detailed task for the AI agent'
        required: true
        type: string

jobs:
  run-safe-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all history for git commands to work correctly
          fetch-depth: 0
          # Use a PAT to allow the workflow to push changes
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          npm install
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config --global user.name "AI Catalyst MCP"
          git config --global user.email "mcp-bot@users.noreply.github.com"

      - name: Run Safe MCP Script
        run: |
          python "scripts/safe_mcp.py" --task "${{ inputs.task_description }}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Push changes to origin
        run: git push origin main