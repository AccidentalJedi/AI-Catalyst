name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        # Install frontend dependencies
        if [ -f "package.json" ]; then
          npm install
        fi

        # Install backend dependencies
        if [ -f "server/package.json" ]; then
          cd server && npm install
        fi
        
    - name: Run npm audit (Frontend)
      run: |
        echo "🔍 Scanning frontend dependencies for vulnerabilities..."
        npm audit --audit-level=moderate || {
          echo "⚠️ Frontend vulnerabilities found - continuing with scan"
          npm audit --audit-level=moderate --json > frontend-audit.json || true
        }

    - name: Run npm audit (Backend)
      run: |
        echo "🔍 Scanning backend dependencies for vulnerabilities..."
        cd server && npm audit --audit-level=moderate || {
          echo "⚠️ Backend vulnerabilities found - continuing with scan"
          npm audit --audit-level=moderate --json > ../backend-audit.json || true
        }
        
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript"
        
    - name: Run Semgrep Security Scan
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/javascript
          p/typescript
          p/react
        generateSarif: "1"
        
    - name: Upload Semgrep results to GitHub
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('semgrep.sarif') != ''
      with:
        sarif_file: semgrep.sarif
        
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
        
    - name: Security scan summary
      if: always()
      run: |
        echo "🛡️ Security scan completed!"
        echo "📊 Check the Security tab for detailed results"
        echo "🔍 CodeQL, Semgrep, and TruffleHog scans performed"

        # Check if audit files were created (indicating vulnerabilities found)
        if [ -f "frontend-audit.json" ]; then
          echo "⚠️ Frontend vulnerabilities detected - review frontend-audit.json"
        else
          echo "✅ No critical frontend vulnerabilities found"
        fi

        if [ -f "backend-audit.json" ]; then
          echo "⚠️ Backend vulnerabilities detected - review backend-audit.json"
        else
          echo "✅ No critical backend vulnerabilities found"
        fi
