name: 'MCP: Generate Task Plan'

on:
  workflow_dispatch:
    inputs:
      brief_file:
        description: 'Path to the project brief markdown file'
        required: true
        default: 'briefs/vvs_enhancements.md'

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml google-generativeai

      - name: Run Planner Agent
        run: |
          python scripts/planner_agent.py \
            --brief "${{ github.event.inputs.brief_file }}" \
            --output "task_definitions.yml"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Commit and push the generated plan
        run: |
          git config --global user.name "AI Catalyst Planner"
          git config --global user.email "planner-bot@users.noreply.github.com"
          git add task_definitions.yml
          git commit -m "feat(planning): Generate task plan from ${{ github.event.inputs.brief_file }}" || echo "No changes to commit"
          git push