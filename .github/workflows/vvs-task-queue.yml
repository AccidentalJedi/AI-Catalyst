name: VVS Task Queue Processor

on:
  workflow_dispatch: # Manual trigger to process one task
  schedule:
    - cron: '0 4 * * 1' # Run every Monday at 4 AM UTC

jobs:
  process-queue:
    runs-on: ubuntu-latest
    # Safety check to prevent running on forks
    if: github.repository == 'gerry-schiller/AI-Catalyst'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A PAT is required to push changes and trigger other workflows
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find next task from plan
        id: find_task
        run: |
          pip install pyyaml
          python -c "
          import yaml, os
          plan_file = 'task_definitions.yml'
          if not os.path.exists(plan_file):
              print('No task_definitions.yml found. Nothing to do.')
              exit()
          with open(plan_file, 'r') as f: data = yaml.safe_load(f)
          next_task = next((t for t in data if t.get('status') != 'COMPLETED'), None)
          if next_task:
              print(f\"Next task found: {next_task['task_id']}\")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as hf:
                  hf.write(f\"task_id={next_task['task_id']}\\n\")
                  hf.write(f\"task_description={next_task['description']}\\n\")
          else:
              print('All tasks in plan are completed.')
          "

      - name: Set up Node.js
        if: steps.find_task.outputs.task_id
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.find_task.outputs.task_id
        run: |
          npm install
          pip install -r requirements.txt

      - name: Configure Git User
        if: steps.find_task.outputs.task_id
        run: |
          git config --global user.name "AI Catalyst MCP"
          git config --global user.email "mcp-bot@users.noreply.github.com"

      - name: Process first task from queue
        if: steps.find_task.outputs.task_id
        id: process_task
        run: |
          echo "Processing task: ${{ steps.find_task.outputs.task_description }}"
          python "scripts/safe_mcp.py" --task "${{ steps.find_task.outputs.task_description }}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Update task queue on success
        if: success() && steps.find_task.outputs.task_id
        run: |
          # Mark task as completed in the plan
          python -c "
          import yaml, os
          plan_file = 'task_definitions.yml'
          task_id = '${{ steps.find_task.outputs.task_id }}'
          with open(plan_file, 'r') as f: data = yaml.safe_load(f)
          for task in data:
              if task.get('task_id') == task_id:
                  task['status'] = 'COMPLETED'
                  break
          with open(plan_file, 'w') as f: yaml.dump(data, f, sort_keys=False)
          "
          git add task_definitions.yml
          git commit -m "chore(mcp): Mark task '${{ steps.find_task.outputs.task_id }}' as completed"
          git push origin main